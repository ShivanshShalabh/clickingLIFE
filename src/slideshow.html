<!doctype html>
<html lang="en" class="stage-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slideshow · clickingLIFE</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23ff8c42'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/sky.js"></script>
</head>
<body class="stage-page">
  <div class="stage" id="stage"></div>

  <div class="topbar">
    <a class="home" href="/">clickingLIFE</a>
    <button class="icon-btn" id="fullscreen" type="button" aria-label="Full screen (F)">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
    </button>
  </div>

  <div class="hud">
    <div>
      <span class="meta" id="meta"></span>
    </div>
    <div class="hud-controls">
      <button class="icon-btn" id="zoom" type="button" aria-pressed="true" aria-label="Slow zoom (Z)">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3M5 7h4M7 5v4"/><path class="i-off" d="m2 14 12-12" hidden/></svg>
      </button>
      <button class="icon-btn" id="prev" type="button" aria-label="Previous photo">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button class="icon-btn" id="pause" type="button" aria-label="Pause (space)">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path class="i-pause" d="M4 3h3v10H4zM9 3h3v10H9z"/><path class="i-play" d="M4 2.5v11l9-5.5z" hidden/></svg>
      </button>
      <button class="icon-btn" id="next" type="button" aria-label="Next photo">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 5 5-5 5"/></svg>
      </button>
    </div>
  </div>

  <div class="progress" id="progress"></div>

  <script type="module" src="/js/slideshow.js"></script>
</body>
</html>
